[binaries]
c = '/home/nima/ankink-sdk/bin/arm-linux-gnueabi-gcc'
cpp = '/home/nima/ankink-sdk/bin/arm-linux-gnueabi-g++'
ar = '/home/nima/ankink-sdk/bin/arm-linux-gnueabi-ar'
strip = '/home/nima/ankink-sdk/bin/arm-linux-gnueabi-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
sys_root = '/home/nima/ankink-sdk/armel'
pkg_config_libdir = ['/home/nima/clion-projects/AnkINK/cmake/armel-pkgconfig', '/home/nima/ankink-sdk/armel/usr/lib/arm-linux-gnueabi/pkgconfig', '/home/nima/ankink-sdk/armel/usr/lib/pkgconfig', '/home/nima/ankink-sdk/armel/usr/share/pkgconfig']

[built-in options]
c_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=softfp', '-I/home/nima/ankink-sdk/armel/usr/include']
cpp_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=softfp', '-I/home/nima/ankink-sdk/armel/usr/include']
c_link_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=softfp']
cpp_link_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=softfp']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'
