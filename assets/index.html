<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AnkINK</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-header">
    <div class="brand"><h1>Ank<span>INK</span></h1><p id="status">Starting AnkINK engine...</p></div>
    <button id="refresh" class="header-button" type="button">Refresh</button>
  </div>
  <div id="warning" class="warning hidden"></div>

  <div id="decks-view">
    <div class="section-heading">
      <p class="eyebrow">COLLECTION</p><h2>Choose a deck</h2>
      <p id="collection-path" class="path"></p>
    </div>
    <div id="decks" class="deck-list"><div class="empty-state">Loading decks...</div></div>
  </div>

  <div id="review-view" class="hidden">
    <div class="review-toolbar">
      <button id="back" class="text-button" type="button">&lsaquo; Decks</button>
      <div class="review-title"><p class="eyebrow">REVIEWING</p><h2 id="review-title">Deck</h2></div>
      <div id="session-count" class="session-count">0 reviewed</div>
    </div>
    <div id="card" class="card">
      <div id="front" class="card-face">Loading...</div>
      <div id="answer-divider" class="answer-divider hidden">ANSWER</div>
      <div id="back-face" class="card-face answer hidden"></div>
    </div>
    <div id="show-controls" class="controls">
      <button id="show-answer" class="primary" type="button">Show answer</button>
    </div>
    <div id="rating-controls" class="controls ratings hidden">
      <button id="rating-1" type="button"><strong>Again</strong><small>1</small></button>
      <button id="rating-2" type="button"><strong>Hard</strong><small>2</small></button>
      <button id="rating-3" type="button"><strong>Good</strong><small>3</small></button>
      <button id="rating-4" type="button"><strong>Easy</strong><small>4</small></button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
