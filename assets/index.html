<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AnkINK</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Ank<span>INK</span></h1>
      <p id="status">Starting WPE WebKit…</p>
    </div>
    <button id="refresh" class="icon-button" type="button" aria-label="Full screen refresh">↻</button>
  </header>

  <aside id="warning" class="warning hidden" role="status"></aside>

  <main>
    <section id="decks-view" aria-labelledby="decks-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">COLLECTION</p>
          <h2 id="decks-title">Choose a deck</h2>
        </div>
        <p id="collection-path" class="path"></p>
      </div>
      <div id="decks" class="deck-list" aria-live="polite">
        <div class="empty-state">Loading decks…</div>
      </div>
    </section>

    <section id="review-view" class="hidden" aria-labelledby="review-title">
      <div class="review-toolbar">
        <button id="back" class="text-button" type="button">‹ Decks</button>
        <div>
          <p class="eyebrow">REVIEWING</p>
          <h2 id="review-title">Deck</h2>
        </div>
        <div id="session-count" class="session-count">0 reviewed</div>
      </div>

      <article id="card" class="card">
        <div id="front" class="card-face"></div>
        <div id="answer-divider" class="answer-divider hidden"><span>ANSWER</span></div>
        <div id="back-face" class="card-face answer hidden"></div>
      </article>

      <div id="show-controls" class="controls single">
        <button id="show-answer" class="primary" type="button">Show answer</button>
      </div>
      <div id="rating-controls" class="controls ratings hidden" aria-label="Rate answer">
        <button type="button" data-rating="1"><strong>Again</strong><small>1</small></button>
        <button type="button" data-rating="2"><strong>Hard</strong><small>2</small></button>
        <button type="button" data-rating="3"><strong>Good</strong><small>3</small></button>
        <button type="button" data-rating="4"><strong>Easy</strong><small>4</small></button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
